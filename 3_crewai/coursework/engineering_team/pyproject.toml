[project]
name = "engineering_team"
version = "0.1.0"
description = "engineering_team using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.14.4"
]

[project.scripts]
kickoff = "engineering_team.main:kickoff"
run_crew = "engineering_team.main:kickoff"
plot = "engineering_team.main:plot"
run_with_trigger = "engineering_team.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
project_id = "a377ca13-fc9d-442a-aedd-fc9865285d10"

[tool.uv.workspace]
members = [
    "sandbox",
]
